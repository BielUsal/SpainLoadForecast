# Backtest protocol. Decisions are logged in docs/DESIGN.md section 16.

issue_time_local: "10:00"      # Europe/Madrid, on day d; forecasts cover the 24 local hours of d+1
timezone: "Europe/Madrid"

# Splits are by target day (local dates, inclusive).
splits:
  train:      {start: "2021-01-01", end: "2024-10-31"}
  validation: {start: "2024-11-01", end: "2025-10-31"}
  test:       {start: "2025-11-01", end: "2026-10-31"}

# Days removed from training and from scoring. The blackout range is provisional; EDA sets it.
masked_days:
  - {start: "2025-04-28", end: "2025-04-29", reason: "Iberian blackout"}
  - {start: "2026-06-11", end: "2026-06-11", reason: "demand about 7 GW below REE's forecast in the evening, cause not investigated; masked for now"}

quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
