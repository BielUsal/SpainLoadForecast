# LightGBM point model. Choices were made on the validation year (DESIGN section 7.2).

features_start: "2021-02-15"   # first target day with a full set of lag features
refit_every_days: 28
half_life_years: 2.0           # training rows are weighted by 0.5 ** (age / half-life)
num_boost_round: 2000
params:
  objective: regression        # squared error; the quantiles come from past out-of-sample errors
  learning_rate: 0.03
  num_leaves: 15
  min_data_in_leaf: 40
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  seed: 0
  verbose: -1
