# Bayesian structural model (NumPyro). See DESIGN section 7.3.

train_start: "2021-01-01"
refit_every_days: 28
n_draws: 300                 # posterior draws used for each forecast
draws_per_sample: 4          # predictive samples per posterior draw
svi:
  map_steps: 4000            # first fit; later refits start from the previous one
  refit_map_steps: 1500
  structure_steps: 2000      # low-rank Gaussian approximation around the mode
  error_steps: 2000
nuts:
  train_end:                 # last day used by the NUTS fit of each split (two days before it starts)
    validation: "2024-10-30"
    test: "2025-10-30"
  chains: 4
  warmup: 500
  samples: 500
  max_tree_depth: 8
  dense_mass: true           # used by the test-year fit only; did not cure the depth limit and doubled the run time (DESIGN 7.3)
